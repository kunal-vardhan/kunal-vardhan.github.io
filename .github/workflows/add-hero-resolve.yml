name: Add homepage hero resolve motion

on:
  push:
    paths:
      - '.github/workflows/add-hero-resolve.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install hero complex-to-clear motion
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path=Path('story.css')
          js_path=Path('story.js')
          index_path=Path('index.html')

          css=css_path.read_text(encoding='utf-8')
          js=js_path.read_text(encoding='utf-8')
          index=index_path.read_text(encoding='utf-8')

          css_marker='/* homepage hero resolve motion */'
          js_marker='/* homepage hero resolve motion */'

          if css_marker not in css:
              css += r'''

/* homepage hero resolve motion */
.hero-resolve{position:relative;display:inline-flex;align-items:baseline;gap:.2em;white-space:nowrap;vertical-align:baseline}
.hero-resolve-word{display:inline-block;transform-origin:50% 80%;will-change:transform,opacity,filter;animation:hero-resolve-word .92s cubic-bezier(.2,.75,.16,1) both;animation-delay:calc(var(--hero-i) * 72ms)}
.hero-resolve-word:nth-child(1){--hero-x:-2px;--hero-y:-6px;--hero-r:-.65deg}
.hero-resolve-word:nth-child(2){--hero-x:1px;--hero-y:4px;--hero-r:.4deg}
.hero-resolve-word:nth-child(3){--hero-x:2px;--hero-y:-3px;--hero-r:-.28deg}
.hero-resolve::after{content:"";position:absolute;left:0;right:0;bottom:-.05em;height:1px;background:currentColor;opacity:0;transform:scaleX(0);transform-origin:left center;animation:hero-resolve-baseline 1.02s cubic-bezier(.2,.75,.16,1) .04s both;pointer-events:none}
@keyframes hero-resolve-word{0%{transform:translate3d(var(--hero-x),var(--hero-y),0) rotate(var(--hero-r));opacity:.56;filter:blur(.45px)}52%{opacity:.92;filter:blur(.08px)}100%{transform:translate3d(0,0,0) rotate(0);opacity:1;filter:blur(0)}}
@keyframes hero-resolve-baseline{0%{transform:scaleX(0);opacity:0}22%{opacity:.18}70%{transform:scaleX(1);opacity:.18}100%{transform:scaleX(1);opacity:0}}
@media(prefers-reduced-motion:reduce){.hero-resolve-word{animation:none!important;transform:none!important;opacity:1!important;filter:none!important}.hero-resolve::after{display:none!important}}
'''
              css_path.write_text(css,encoding='utf-8')

          if js_marker not in js:
              js += r'''

/* homepage hero resolve motion */
(()=>{
  const h1=document.querySelector('.story-hero h1');
  if(!h1||h1.dataset.resolveReady==='true')return;
  h1.dataset.resolveReady='true';
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const target='hard to explain.';
  const full=h1.textContent||'';
  const start=full.lastIndexOf(target);
  if(start<0)return;
  const before=full.slice(0,start);
  const after=full.slice(start+target.length);
  const phrase=document.createElement('span');
  phrase.className='hero-resolve';
  phrase.setAttribute('aria-label',target);
  ['hard','to','explain.'].forEach((word,i)=>{
    const span=document.createElement('span');
    span.className='hero-resolve-word';
    span.setAttribute('aria-hidden','true');
    span.style.setProperty('--hero-i',String(i));
    span.textContent=word;
    phrase.appendChild(span);
  });
  h1.replaceChildren(document.createTextNode(before),phrase,document.createTextNode(after));
})();
'''
              js_path.write_text(js,encoding='utf-8')

          if '/story.css?v=5' in index:
              index=index.replace('/story.css?v=5','/story.css?v=6',1)
          elif '/story.css?v=6' not in index:
              raise SystemExit('Unexpected homepage story.css version')

          if '/story.js?v=3' in index:
              index=index.replace('/story.js?v=3','/story.js?v=4',1)
          elif '/story.js?v=4' not in index:
              raise SystemExit('Unexpected homepage story.js version')

          index_path.write_text(index,encoding='utf-8')
          PY

      - name: Validate hero motion
        run: |
          node --check story.js
          python - <<'PY'
          from pathlib import Path
          css=Path('story.css').read_text(encoding='utf-8')
          js=Path('story.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          for token in ['.hero-resolve-word','hero-resolve-baseline','prefers-reduced-motion']:
              if token not in css: raise SystemExit(f'Missing CSS token: {token}')
          for token in ["const target='hard to explain.'","aria-label",'replaceChildren']:
              if token not in js: raise SystemExit(f'Missing JS token: {token}')
          if '/story.css?v=6' not in index or '/story.js?v=4' not in index:
              raise SystemExit('Homepage cache-bust versions were not updated')
          print('Validated complex-to-clear hero phrase resolution')
          PY

      - name: Commit homepage hero animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          LATEST="$(git rev-parse origin/main)"
          BASE="$(git rev-parse HEAD)"
          echo "Latest main SHA: $LATEST"
          echo "Checked-out SHA: $BASE"
          if [ "$LATEST" != "$BASE" ]; then
            echo "main changed while preparing hero animation; refusing to overwrite it"
            exit 1
          fi
          git add story.css story.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add complex-to-clear homepage hero motion"
          git push origin HEAD:main
