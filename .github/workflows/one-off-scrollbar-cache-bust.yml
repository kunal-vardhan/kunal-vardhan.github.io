name: One-off scrollbar cache bust
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-scrollbar-cache-bust.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Bump scrollbar stylesheet version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('work.html')
          text = path.read_text()
          old = '<link rel="stylesheet" href="/work-preview-motion.css?v=1">'
          new = '<link rel="stylesheet" href="/work-preview-motion.css?v=2">'
          if old not in text:
              raise SystemExit('Expected work-preview-motion.css?v=1 reference not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "Kunal Vardhan"
          git config user.email "kunalwritescopy@gmail.com"
          git add work.html
          git commit -m "Refresh scrollbar hiding stylesheet"
          git push origin HEAD:main
