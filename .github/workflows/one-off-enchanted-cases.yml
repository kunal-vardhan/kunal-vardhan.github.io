name: One-off enchanted cases patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-enchanted-cases.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Wire enchanted case study prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_css = '<link rel="stylesheet" href="/threshold-entrance.css?v=1">'
          new_css = old_css + '<link rel="stylesheet" href="/enchanted-cases.css?v=1">'
          if old_css not in s:
              raise SystemExit('CSS marker not found')
          s = s.replace(old_css, new_css, 1)

          old_section = '<section class="section"><div class="container"><div class="section-head"><div><p class="eyebrow">Case studies</p><h2>Projects where I can show the work and the result.</h2></div><p>The full pages cover the context, what I owned, the assets I created, how I planned the content, and the evidence I still have.</p></div><div class="feature-grid">'
          footsteps = '<div class="enchanted-footsteps" aria-hidden="true">' + ''.join('<span></span>' for _ in range(8)) + '</div>'
          new_section = '<section class="section enchanted-cases">' + footsteps + '<div class="container"><p class="enchanted-note">Actual proof underneath. No incantation required.</p><div class="section-head"><div><p class="eyebrow">Case studies</p><h2>Four projects. I kept the receipts.</h2></div><p>The full pages cover the context, what I owned, the assets I created, how I planned the content, and the evidence I still have.</p></div><div class="feature-grid">'
          if old_section not in s:
              raise SystemExit('Case-study section marker not found')
          s = s.replace(old_section, new_section, 1)

          old_js = '<script src="/threshold-entrance.js?v=2" defer></script><script src="/proof-metrics.js?v=3" defer></script>'
          new_js = '<script src="/threshold-entrance.js?v=2" defer></script><script src="/enchanted-cases.js?v=1" defer></script><script src="/proof-metrics.js?v=3" defer></script>'
          if old_js not in s:
              raise SystemExit('Script marker not found')
          s = s.replace(old_js, new_js, 1)

          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "Kunal Vardhan"
          git config user.email "kunalwritescopy@gmail.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add index.html
          git commit -m "Turn homepage cases into living proof gallery"
          git push origin HEAD:main
