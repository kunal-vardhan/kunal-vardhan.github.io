name: One-off strategy asset morph patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-strategy-asset-morph.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Replace stage-to-asset interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path('strategy-motion.js')
          js_text = js.read_text()
          js_marker = "\n(() => {\n  const grid = document.querySelector('.strategy-grid-2');"
          if js_marker not in js_text:
              raise SystemExit('Strategy asset interaction marker not found')
          first, _ = js_text.split(js_marker, 1)
          new_js = r'''
(() => {
  const grid = document.querySelector('.strategy-grid-2');
  const funnel = grid?.querySelector('.funnel');
  const cluster = grid?.querySelector('.cluster');
  const stages = funnel ? [...funnel.children] : [];
  const assets = cluster ? [...cluster.querySelectorAll('.node')] : [];
  const hub = cluster?.querySelector('.hub');
  const rightPanel = cluster?.closest('.panel');
  if (!grid || !funnel || !cluster || !hub || !rightPanel || stages.length !== 4 || assets.length !== 5) return;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const scenarios = [
    {
      stage: 'Awareness',
      primary: 0,
      secondary: [2],
      format: 'Educational guide',
      title: 'What is API management?',
      why: 'Build category understanding before asking the reader to compare vendors.'
    },
    {
      stage: 'Consideration',
      primary: 3,
      secondary: [1, 2],
      format: 'Comparison guide',
      title: 'API gateway vs API management',
      why: 'Help the reader compare approaches and narrow the options.'
    },
    {
      stage: 'Decision',
      primary: 4,
      secondary: [3],
      format: 'Commercial guide',
      title: 'API management pricing and implementation',
      why: 'Answer cost, implementation, and vendor questions close to a buying decision.'
    },
    {
      stage: 'Lifecycle',
      primary: 1,
      secondary: [0],
      format: 'Adoption guide',
      title: 'API governance best practices',
      why: 'Help existing users adopt the product well and expand how they use it.'
    }
  ];

  let demoPlayed = false;
  let demoTimers = [];
  let activeIndex = null;
  let resizeTimer;

  grid.classList.add('strategy-asset-morph');
  hub.innerHTML = '<span>Same topic</span><strong>API management</strong>';

  const output = document.createElement('article');
  output.className = 'strategy-asset-output';
  output.id = 'strategy-asset-output';
  output.innerHTML = '<span class="strategy-asset-kicker">Same topic · API management</span><strong class="strategy-asset-title">One topic. Four possible assets.</strong><span class="strategy-asset-meta">Pick a buyer stage on the left.</span><p class="strategy-asset-why">The subject stays the same. The reader’s job decides what the asset should become.</p>';
  rightPanel.appendChild(output);

  const note = document.createElement('div');
  note.className = 'strategy-asset-note';
  note.id = 'strategy-asset-note';
  note.innerHTML = '<strong>Try it</strong><span>Pick a buyer stage. The topic stays the same. The asset changes.</span>';
  grid.appendChild(note);

  const bridge = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  bridge.classList.add('strategy-asset-bridge');
  bridge.setAttribute('aria-hidden', 'true');
  const bridgePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  bridgePath.setAttribute('pathLength', '1');
  bridge.appendChild(bridgePath);
  grid.insertBefore(bridge, grid.firstChild);

  const bridgeLabel = document.createElement('span');
  bridgeLabel.className = 'strategy-bridge-label';
  bridgeLabel.textContent = 'buyer intent';
  grid.appendChild(bridgeLabel);

  stages.forEach((stage, index) => {
    stage.tabIndex = 0;
    stage.dataset.stageIndex = String(index);
    stage.setAttribute('aria-controls', output.id);
    stage.setAttribute('aria-describedby', note.id);
  });

  const cancelDemo = () => {
    demoTimers.forEach(clearTimeout);
    demoTimers = [];
    demoPlayed = true;
  };

  const drawBridge = () => {
    if (activeIndex === null || window.matchMedia('(max-width:700px)').matches) return;
    const gridRect = grid.getBoundingClientRect();
    const stageRect = stages[activeIndex].getBoundingClientRect();
    const outputRect = output.getBoundingClientRect();
    const width = Math.max(1, grid.clientWidth);
    const height = Math.max(1, grid.scrollHeight);
    const startX = stageRect.right - gridRect.left;
    const startY = stageRect.top - gridRect.top + stageRect.height / 2;
    const endX = outputRect.left - gridRect.left;
    const endY = outputRect.top - gridRect.top + outputRect.height / 2;
    const control = Math.max(34, (endX - startX) * .48);

    bridge.setAttribute('viewBox', `0 0 ${width} ${height}`);
    bridge.setAttribute('width', String(width));
    bridge.setAttribute('height', String(height));
    bridgePath.setAttribute('d', `M ${startX} ${startY} C ${startX + control} ${startY}, ${endX - control} ${endY}, ${endX} ${endY}`);

    bridgeLabel.style.left = `${(startX + endX) / 2}px`;
    bridgeLabel.style.top = `${(startY + endY) / 2}px`;
  };

  const renderOutput = scenario => {
    output.querySelector('.strategy-asset-kicker').textContent = `Same topic · API management · ${scenario.stage}`;
    output.querySelector('.strategy-asset-title').textContent = scenario.title;
    output.querySelector('.strategy-asset-meta').textContent = scenario.format;
    output.querySelector('.strategy-asset-why').textContent = scenario.why;

    if (!reduceMotion.matches && !document.documentElement.classList.contains('boring-mode')) {
      output.animate(
        [
          { opacity: .45, transform: 'translateY(6px)' },
          { opacity: 1, transform: 'translateY(0)' }
        ],
        { duration: 220, easing: 'ease-out' }
      );
    }
  };

  const activate = (index, fromUser = false) => {
    if (fromUser) cancelDemo();
    activeIndex = index;
    const scenario = scenarios[index];
    grid.classList.add('has-stage');
    stages.forEach((stage, i) => stage.classList.toggle('is-active', i === index));
    assets.forEach((asset, i) => {
      asset.classList.toggle('is-primary', i === scenario.primary);
      asset.classList.toggle('is-secondary', scenario.secondary.includes(i));
    });
    hub.classList.add('is-active');
    renderOutput(scenario);
    note.innerHTML = `<strong>${scenario.stage}</strong><span>${scenario.format}. Same topic, different job.</span>`;
    requestAnimationFrame(() => {
      drawBridge();
      bridgePath.classList.remove('is-drawn');
      bridgeLabel.classList.remove('is-visible');
      requestAnimationFrame(() => {
        bridgePath.classList.add('is-drawn');
        bridgeLabel.classList.add('is-visible');
      });
    });
  };

  const clearSelection = () => {
    activeIndex = null;
    grid.classList.remove('has-stage');
    stages.forEach(stage => stage.classList.remove('is-active'));
    assets.forEach(asset => asset.classList.remove('is-primary', 'is-secondary'));
    hub.classList.remove('is-active');
    bridgePath.classList.remove('is-drawn');
    bridgeLabel.classList.remove('is-visible');
    output.querySelector('.strategy-asset-kicker').textContent = 'Same topic · API management';
    output.querySelector('.strategy-asset-title').textContent = 'One topic. Four possible assets.';
    output.querySelector('.strategy-asset-meta').textContent = 'Pick a buyer stage on the left.';
    output.querySelector('.strategy-asset-why').textContent = 'The subject stays the same. The reader’s job decides what the asset should become.';
    note.innerHTML = '<strong>Try it</strong><span>Pick a buyer stage. The topic stays the same. The asset changes.</span>';
  };

  const runDemo = () => {
    if (demoPlayed) return;
    demoPlayed = true;
    if (reduceMotion.matches || document.documentElement.classList.contains('boring-mode')) {
      clearSelection();
      return;
    }
    scenarios.forEach((_, index) => {
      demoTimers.push(setTimeout(() => activate(index), index * 820));
    });
    demoTimers.push(setTimeout(clearSelection, scenarios.length * 820 + 440));
  };

  stages.forEach((stage, index) => {
    stage.addEventListener('pointerenter', event => {
      if (event.pointerType === 'mouse') activate(index, true);
    });
    stage.addEventListener('focus', () => activate(index, true));
    stage.addEventListener('click', () => activate(index, true));
  });

  document.addEventListener('pointerdown', event => {
    if (!grid.contains(event.target)) clearSelection();
  });

  const observer = new IntersectionObserver(entries => {
    if (entries.some(entry => entry.isIntersecting)) {
      runDemo();
      observer.disconnect();
    }
  }, { threshold: .3 });
  observer.observe(grid);

  const scheduleBridge = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawBridge, 90);
  };
  window.addEventListener('resize', scheduleBridge, { passive: true });
  document.fonts?.ready.then(drawBridge).catch(() => {});

  reduceMotion.addEventListener?.('change', event => {
    if (event.matches) {
      cancelDemo();
      clearSelection();
    }
  });
  window.addEventListener('portfolio:boringchange', () => {
    if (document.documentElement.classList.contains('boring-mode')) {
      cancelDemo();
      clearSelection();
    }
  });
})();'''
          js.write_text(first + '\n' + new_js.strip() + '\n')

          css = Path('strategy-motion.css')
          css_text = css.read_text()
          css_marker = '/* Strategy page: buyer stage changes the right asset */'
          if css_marker not in css_text:
              raise SystemExit('Strategy asset CSS marker not found')
          css_first, _ = css_text.split(css_marker, 1)
          new_css = r'''/* Strategy page: one topic morphs with buyer intent */
.strategy-asset-morph{position:relative;isolation:isolate}
.strategy-asset-morph>.panel{position:relative;z-index:2}
.strategy-asset-morph .funnel>div{position:relative;transition:border-color .2s ease,background-color .2s ease,transform .2s ease,opacity .2s ease;cursor:default}
.strategy-asset-morph .funnel>div.is-active{border-color:var(--ink);background:#e5ebe6;transform:translateX(5px)}
.strategy-asset-morph .funnel>div:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.strategy-asset-morph .cluster .node,.strategy-asset-morph .cluster .hub{transition:border-color .22s ease,background-color .22s ease,transform .22s ease,opacity .22s ease}
.strategy-asset-morph .cluster .hub{line-height:1.25}
.strategy-asset-morph .cluster .hub span{display:block;color:var(--sage);font:700 .5rem/1.2 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.strategy-asset-morph .cluster .hub strong{display:block;margin-top:4px;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:.82rem;font-weight:500;color:var(--ink)}
.strategy-asset-morph .cluster .node{opacity:1}
.strategy-asset-morph.has-stage .cluster .node{opacity:.3}
.strategy-asset-morph .cluster .node.is-primary{opacity:1;border-color:var(--ink);background:#e5ebe6}
.strategy-asset-morph .cluster .node.is-secondary{opacity:.78;border-color:var(--sage);background:#edf1ed}
.strategy-asset-morph .cluster .node.is-primary.n5,.strategy-asset-morph .cluster .node.is-secondary.n5{transform:translateX(-50%) translateY(-4px)}
.strategy-asset-morph .cluster .node.is-primary:not(.n5),.strategy-asset-morph .cluster .node.is-secondary:not(.n5){transform:translateY(-4px)}
.strategy-asset-morph .cluster .hub.is-active{border-color:var(--ink);background:#dfe7e0;transform:translate(-50%,-50%) scale(1.035)}
.strategy-asset-output{margin-top:12px;padding:13px 0 0;border-top:1px solid var(--ink);min-height:126px}
.strategy-asset-kicker{display:block;color:var(--sage);font-size:.54rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.strategy-asset-title{display:block;margin-top:5px;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:1rem;font-weight:500;line-height:1.28;color:var(--ink)}
.strategy-asset-meta{display:block;margin-top:6px;color:var(--ink);font-size:.64rem;font-weight:700}
.strategy-asset-why{margin:5px 0 0;max-width:420px;color:var(--slate);font-size:.65rem;line-height:1.5}
.strategy-asset-note{position:relative;z-index:2;grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline;padding:11px 13px;border-top:1px solid var(--line);color:var(--slate);font-size:.67rem;line-height:1.5}
.strategy-asset-note strong{color:var(--sage);font-size:.58rem;letter-spacing:.09em;text-transform:uppercase}
.strategy-asset-note span{color:var(--slate)}
.strategy-asset-bridge{position:absolute;inset:0;z-index:1;overflow:visible;pointer-events:none}
.strategy-asset-bridge path{fill:none;stroke:var(--sage);stroke-width:1.35;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .42s ease,opacity .2s ease}
.strategy-asset-bridge path.is-drawn{stroke-dashoffset:0;opacity:.58}
.strategy-bridge-label{position:absolute;z-index:3;padding:2px 6px;border:1px solid var(--line);background:var(--surface);color:var(--sage);font-size:.5rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;opacity:0;transform:translate(-50%,-50%) scale(.92);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.strategy-bridge-label.is-visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(max-width:700px){
  .strategy-asset-bridge,.strategy-bridge-label{display:none}
  .strategy-asset-note{grid-template-columns:1fr;gap:3px}
  .strategy-asset-morph .funnel>div.is-active{transform:none}
  .strategy-asset-morph .cluster .node.is-primary.n5,.strategy-asset-morph .cluster .node.is-secondary.n5{transform:translateX(-50%)}
  .strategy-asset-morph .cluster .node.is-primary:not(.n5),.strategy-asset-morph .cluster .node.is-secondary:not(.n5){transform:none}
  .strategy-asset-morph .cluster .hub.is-active{transform:translate(-50%,-50%)}
}
@media(prefers-reduced-motion:reduce){
  .strategy-asset-morph .funnel>div,.strategy-asset-morph .cluster .node,.strategy-asset-morph .cluster .hub,.strategy-asset-bridge path,.strategy-bridge-label{transition:none!important}
}
html.boring-mode .strategy-asset-morph .funnel>div,html.boring-mode .strategy-asset-morph .cluster .node,html.boring-mode .strategy-asset-morph .cluster .hub,html.boring-mode .strategy-asset-bridge path,html.boring-mode .strategy-bridge-label{transition:none!important}'''
          css.write_text(css_first.rstrip() + '\n\n' + new_css.strip() + '\n')

          html = Path('strategy.html')
          html_text = html.read_text()
          if '/strategy-motion.css?v=2' not in html_text or '/strategy-motion.js?v=2' not in html_text:
              raise SystemExit('Expected strategy motion cache refs not found')
          html_text = html_text.replace('/strategy-motion.css?v=2', '/strategy-motion.css?v=3', 1)
          html_text = html_text.replace('/strategy-motion.js?v=2', '/strategy-motion.js?v=3', 1)
          html.write_text(html_text)
          PY
      - name: Commit and push
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "Kunal Vardhan"
          git config user.email "kunalwritescopy@gmail.com"
          git add strategy-motion.js strategy-motion.css strategy.html
          git commit -m "Make buyer intent morph the content asset"
          git push origin HEAD:main
