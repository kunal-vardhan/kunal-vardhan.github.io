name: One-off strategy asset morph patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-strategy-asset-morph.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Replace stage-to-asset interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          js_b64 = ''
          css_b64 = ''
          js = Path('strategy-motion.js')
          js_text = js.read_text()
          js_marker = "\n(() => {\n  const grid = document.querySelector('.strategy-grid-2');"
          if js_marker not in js_text:
              raise SystemExit('Strategy asset interaction marker not found')
          first, _ = js_text.split(js_marker, 1)
          js.write_text(first + '\n' + base64.b64decode(js_b64).decode() + '\n')

          css = Path('strategy-motion.css')
          css_text = css.read_text()
          css_marker = '/* Strategy page: buyer stage changes the right asset */'
          if css_marker not in css_text:
              raise SystemExit('Strategy asset CSS marker not found')
          css_first, _ = css_text.split(css_marker, 1)
          css.write_text(css_first.rstrip() + '\n\n' + base64.b64decode(css_b64).decode() + '\n')

          html = Path('strategy.html')
          html_text = html.read_text()
          if '/strategy-motion.css?v=2' not in html_text or '/strategy-motion.js?v=2' not in html_text:
              raise SystemExit('Expected strategy motion cache refs not found')
          html_text = html_text.replace('/strategy-motion.css?v=2', '/strategy-motion.css?v=3', 1)
          html_text = html_text.replace('/strategy-motion.js?v=2', '/strategy-motion.js?v=3', 1)
          html.write_text(html_text)
          PY
      - name: Commit and push
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "Kunal Vardhan"
          git config user.email "kunalwritescopy@gmail.com"
          git add strategy-motion.js strategy-motion.css strategy.html
          git commit -m "Make buyer intent morph the content asset"
          git push origin HEAD:main
