name: Capture work previews

on:
  push:
    paths:
      - '.github/workflows/capture-work-previews.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture clean full-page previews
        run: |
          mkdir -p work-previews
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');

          const samples = [
            ['learniverse-home.png', 'https://learniverse.app/'],
            ['digitalapi-healthcare.png', 'https://www.digitalapi.ai/industry/healthcare'],
            ['digitalapi-vs-mulesoft.png', 'https://www.digitalapi.ai/comparison/digitalapi-vs-mulesoft'],
            ['digitalapi-home.png', 'https://www.digitalapi.ai/'],
            ['apty-vs-walkme.png', 'https://apty.ai/apty-vs-walkme/'],
            ['apty-ai.png', 'https://apty.ai/apty-ai/'],
            ['apty-home.png', 'https://apty.ai/'],
            ['apty-servicenow-implementation-cost.png', 'https://apty.ai/blog/servicenow-implementation-cost/'],
            ['digitalapi-api-management-cost.png', 'https://www.digitalapi.ai/blogs/api-management-cost'],
            ['digitalapi-api-frameworks.png', 'https://www.digitalapi.ai/blogs/top-10-api-frameworks-choose-your-best-fit-for-2026'],
            ['digitalapi-rate-limit.png', 'https://www.digitalapi.ai/blogs/api-rate-limit-exceeded'],
            ['fareye-direct-store-delivery.png', 'https://fareye.com/resources/blogs/what-is-direct-store-delivery'],
            ['fareye-routing-software.png', 'https://fareye.com/resources/blogs/best-delivery-routing-software'],
            ['fareye-last-mile-carrier-tracking.png', 'https://fareye.com/resources/blogs/what-is-last-mile-carrier-tracking'],
            ['lateshipment-returns-management-software.png', 'https://www.lateshipment.com/blog/returns-management-software/'],
            ['lateshipment-fedex-delivery-exceptions.png', 'https://www.lateshipment.com/blog/fedex-delivery-exceptions/']
          ];

          async function dismissOverlays(page) {
            await page.keyboard.press('Escape').catch(() => {});

            const closeSelectors = [
              '[role="dialog"] button[aria-label*="close" i]',
              '[aria-modal="true"] button[aria-label*="close" i]',
              'button[aria-label="Close"]',
              'button[title*="close" i]',
              '[class*="popup" i] [class*="close" i]',
              '[class*="modal" i] [class*="close" i]',
              '[class*="newsletter" i] [class*="close" i]',
              '[class*="subscribe" i] [class*="close" i]'
            ];

            for (const selector of closeSelectors) {
              const locators = page.locator(selector);
              const count = Math.min(await locators.count().catch(() => 0), 8);
              for (let i = 0; i < count; i++) {
                const item = locators.nth(i);
                if (await item.isVisible().catch(() => false)) {
                  await item.click({ force: true, timeout: 1200 }).catch(() => {});
                }
              }
            }

            await page.evaluate(() => {
              const popupWords = /newsletter|subscribe|sign\s*up|stay\s+updated|get\s+updates|join\s+our|email\s+updates|cookie|privacy\s+choices/i;
              const candidates = Array.from(document.querySelectorAll('body *'));

              for (const el of candidates) {
                const style = getComputedStyle(el);
                if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) continue;
                const rect = el.getBoundingClientRect();
                if (rect.width < 180 || rect.height < 60) continue;
                const text = (el.innerText || '').replace(/\s+/g, ' ').trim();
                const dialogLike = el.getAttribute('role') === 'dialog' || el.getAttribute('aria-modal') === 'true';
                const overlayLike = (style.position === 'fixed' || style.position === 'sticky') && Number.parseInt(style.zIndex || '0', 10) >= 10;
                if ((dialogLike || overlayLike) && popupWords.test(text)) {
                  el.remove();
                }
              }

              for (const iframe of document.querySelectorAll('iframe')) {
                const src = (iframe.getAttribute('src') || '').toLowerCase();
                if (/intercom|hubspot|drift|crisp|zendesk|chat|popup|newsletter/.test(src)) iframe.remove();
              }
            }).catch(() => {});
          }

          async function loadEverything(page) {
            await page.waitForTimeout(1800);
            await dismissOverlays(page);

            let lastHeight = 0;
            let stablePasses = 0;
            for (let i = 0; i < 90; i++) {
              const state = await page.evaluate(() => ({
                y: window.scrollY,
                viewport: window.innerHeight,
                height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)
              }));

              if (state.height === lastHeight) stablePasses += 1;
              else stablePasses = 0;
              lastHeight = state.height;

              if (state.y + state.viewport >= state.height - 4 && stablePasses >= 2) break;
              await page.evaluate(step => window.scrollBy(0, step), Math.max(520, Math.floor(state.viewport * 0.78)));
              await page.waitForTimeout(170);
              await dismissOverlays(page);
            }

            await page.evaluate(async () => {
              if (document.fonts && document.fonts.ready) await document.fonts.ready;
              const pending = Array.from(document.images).filter(img => !img.complete);
              await Promise.race([
                Promise.all(pending.map(img => new Promise(resolve => {
                  img.addEventListener('load', resolve, { once: true });
                  img.addEventListener('error', resolve, { once: true });
                }))),
                new Promise(resolve => setTimeout(resolve, 8000))
              ]);
              window.scrollTo(0, 0);
            });

            await page.waitForTimeout(1200);
            await dismissOverlays(page);
            await page.addStyleTag({ content: '*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}' }).catch(() => {});
            await page.waitForTimeout(350);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (const [filename, url] of samples) {
              const extraSharp = filename === 'digitalapi-vs-mulesoft.png';
              const context = await browser.newContext({
                viewport: { width: extraSharp ? 1280 : 1365, height: 960 },
                deviceScaleFactor: extraSharp ? 2 : 1.5,
                colorScheme: 'light',
                reducedMotion: 'reduce',
                userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/132 Safari/537.36'
              });
              const page = await context.newPage();

              try {
                console.log(`Capturing ${url}`);
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
                await loadEverything(page);
                await page.screenshot({
                  path: path.join('work-previews', filename),
                  fullPage: true,
                  animations: 'disabled',
                  caret: 'hide'
                });
              } catch (error) {
                console.error(`Failed ${url}:`, error.message);
              } finally {
                await context.close();
              }
            }

            await browser.close();
          })();
          NODE

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work-previews
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
          else
            git commit -m "Recapture clean work preview screenshots"
            git push
          fi
