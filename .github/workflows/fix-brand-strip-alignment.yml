name: Fix brand strip alignment

on:
  push:
    paths:
      - '.github/workflows/fix-brand-strip-alignment.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align homepage brand wordmarks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('story.css')
          css = path.read_text(encoding='utf-8')
          old = '.brand-strip{padding:24px 0;border-bottom:1px solid rgba(28,28,28,.13)}.wordmark-strip{display:flex;align-items:center;flex-wrap:wrap;gap:15px 27px;margin-top:12px}.wordmark{font-weight:700;font-size:.88rem;color:var(--ink);opacity:.88;letter-spacing:-.02em}.wordmark.serif{font-family:"Playfair Display",serif;font-size:.96rem}.wordmark.upper{text-transform:uppercase;font-size:.75rem;letter-spacing:.02em}.wordmark.light{font-weight:500}'
          new = '.brand-strip{padding:24px 0;border-bottom:1px solid rgba(28,28,28,.13)}.wordmark-strip{display:flex;align-items:stretch;flex-wrap:wrap;column-gap:30px;row-gap:12px;margin-top:12px}.wordmark{display:inline-flex;align-items:center;height:30px;line-height:1;white-space:nowrap;font-weight:700;font-size:.88rem;color:var(--ink);opacity:.88;letter-spacing:-.02em}.wordmark.serif{font-family:"Playfair Display",serif;font-size:.96rem}.wordmark.upper{text-transform:uppercase;font-size:.75rem;letter-spacing:.02em}.wordmark.light{font-weight:500}'
          if old not in css:
              raise SystemExit('Expected brand-strip CSS block not found; refusing broad edit')
          if css.count(old) != 1:
              raise SystemExit(f'Expected exactly one brand-strip CSS block, found {css.count(old)}')
          path.write_text(css.replace(old, new, 1), encoding='utf-8')
          PY

          rm .github/workflows/fix-brand-strip-alignment.yml

      - name: Verify and commit targeted fix
        run: |
          grep -F 'wordmark{display:inline-flex;align-items:center;height:30px;line-height:1;white-space:nowrap' story.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          LATEST="$(git rev-parse origin/main)"
          BASE="$(git rev-parse HEAD)"
          echo "Latest main SHA: $LATEST"
          echo "Checked-out SHA: $BASE"
          if [ "$LATEST" != "$BASE" ]; then
            echo "main changed before write; refusing to overwrite it"
            exit 1
          fi
          git add story.css
          git add -u .github/workflows/fix-brand-strip-alignment.yml
          git commit -m "Align homepage brand wordmarks"
          git push origin HEAD:main
