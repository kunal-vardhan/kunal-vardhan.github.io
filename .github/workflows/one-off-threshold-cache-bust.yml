name: One-off threshold cache bust
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-threshold-cache-bust.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Bump threshold script version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<script src="/threshold-entrance.js?v=1" defer></script>'
          new = '<script src="/threshold-entrance.js?v=2" defer></script>'
          if old not in s:
              raise SystemExit('Threshold script marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "Kunal Vardhan"
          git config user.email "kunalwritescopy@gmail.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add index.html
          git commit -m "Load smoother homepage threshold motion"
          git push origin HEAD:main
