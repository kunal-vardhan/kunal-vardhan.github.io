name: Render Meal Plan as page images

on:
  push:
    paths:
      - '.github/workflows/render-meal-plan-pages.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render and optimize all 61 Meal Plan pages
        run: |
          python -m pip install --disable-pip-version-check pymupdf pillow
          python - <<'PY'
          from pathlib import Path
          import re
          import fitz
          from PIL import Image

          source = Path('ebook-previews/meal-plan.pdf')
          if not source.exists():
              raise SystemExit('meal-plan.pdf is missing')

          doc = fitz.open(source)
          if doc.page_count != 61:
              raise SystemExit(f'Expected 61 pages, got {doc.page_count}')

          outdir = Path('ebook-previews')
          for old in outdir.glob('meal-plan-page-*.webp'):
              old.unlink()

          rendered = []
          target_width = 720
          for index, page in enumerate(doc, start=1):
              rect = page.rect
              scale = target_width / rect.width
              pix = page.get_pixmap(matrix=fitz.Matrix(scale, scale), colorspace=fitz.csRGB, alpha=False)
              image = Image.frombytes('RGB', (pix.width, pix.height), pix.samples)
              output = outdir / f'meal-plan-page-{index:02d}.webp'
              quality = 74
              image.save(output, 'WEBP', quality=quality, method=4)
              while output.stat().st_size > 180_000 and quality > 50:
                  quality -= 6
                  image.save(output, 'WEBP', quality=quality, method=4)
              rendered.append((output, pix.width, pix.height, output.stat().st_size))

          doc.close()

          if len(rendered) != 61:
              raise SystemExit(f'Expected 61 rendered pages, got {len(rendered)}')
          total = sum(item[3] for item in rendered)
          largest = max(item[3] for item in rendered)
          if total > 12_000_000:
              raise SystemExit(f'Rendered set is too heavy: {total} bytes')
          if largest > 220_000:
              raise SystemExit(f'A rendered page is too heavy: {largest} bytes')

          html_path = Path('work.html')
          html = html_path.read_text(encoding='utf-8')
          byline = '<aside class="byline-note" aria-label="Ghostwriting and byline disclosure"><span class="byline-label">About the bylines</span><strong>Why some samples don’t have my name</strong><p>A part of my client work has been ghostwritten or published under the brand’s name. So you may open a sample and not see “Kunal Vardhan” in the byline. The pieces shown here are work I contributed to directly through writing, research, structure, or content development.</p></aside>'
          if html.count(byline) != 1:
              raise SystemExit('Exact byline disclosure was not found once before patching')

          images = []
          for i, (file, width, height, _) in enumerate(rendered, start=1):
              alt = 'Your Personal Meal Plan eBook cover' if i == 1 else ''
              images.append(
                  f'<img src="/{file.as_posix()}" width="{width}" height="{height}" alt="{alt}" loading="lazy" decoding="async" fetchpriority="low">'
              )
          stack = ''.join(images)
          replacement = (
              '<article class="ebook-sample-card"><div class="visual-work-head"><div><span>FastMate · eBook</span>'
              '<h3>Your Personal Meal Plan</h3></div></div>'
              '<div class="ebook-scroll-frame" aria-label="Full 61-page Your Personal Meal Plan eBook">'
              + stack +
              '</div><p>Full 61-page eBook covering the complete 30-day meal plan and supporting menu sections.</p></article>'
          )
          pattern = re.compile(r'<article class="ebook-sample-card"><div class="visual-work-head"><div><span>FastMate · eBook</span><h3>Your Personal Meal Plan</h3></div></div>.*?</article>', re.S)
          patched, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Meal Plan card replacement, got {count}')
          if patched.count(byline) != 1:
              raise SystemExit('Byline disclosure changed during patch')
          if '<iframe' in re.search(pattern, patched).group(0):
              raise SystemExit('PDF iframe still present after patch')
          if patched.count('meal-plan-page-') < 61:
              raise SystemExit('Not all Meal Plan page references were written')

          html_path.write_text(patched, encoding='utf-8')
          source.unlink()
          print(f'Rendered 61 pages at {target_width}px width')
          print(f'Total optimized image weight: {total / 1024 / 1024:.2f} MiB')
          print(f'Largest page: {largest / 1024:.1f} KiB')
          PY

      - name: Validate single-scroll implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('work.html').read_text(encoding='utf-8')
          card = re.search(r'<article class="ebook-sample-card"><div class="visual-work-head"><div><span>FastMate · eBook</span><h3>Your Personal Meal Plan</h3></div></div>.*?</article>', html, re.S)
          if not card:
              raise SystemExit('Meal Plan card missing')
          block = card.group(0)
          if '<iframe' in block or '.pdf' in block:
              raise SystemExit('Meal Plan still depends on a PDF viewer')
          refs = re.findall(r'meal-plan-page-\d{2}\.webp', block)
          if len(refs) != 61 or len(set(refs)) != 61:
              raise SystemExit(f'Expected 61 unique page images, got {len(set(refs))}')
          files = sorted(Path('ebook-previews').glob('meal-plan-page-*.webp'))
          if len(files) != 61:
              raise SystemExit(f'Expected 61 WebP files, got {len(files)}')
          if Path('ebook-previews/meal-plan.pdf').exists():
              raise SystemExit('Source PDF was not cleaned up')
          print('Validated: 61 unique WebP pages, no iframe, no PDF, one native scroll frame')
          PY

      - name: Commit production-ready Meal Plan preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          LATEST="$(git rev-parse origin/main)"
          BASE="$(git rev-parse HEAD)"
          echo "Latest main SHA: $LATEST"
          echo "Checked-out SHA: $BASE"
          if [ "$LATEST" != "$BASE" ]; then
            echo "main changed while rendering; refusing to overwrite it"
            exit 1
          fi
          git add work.html ebook-previews/meal-plan-page-*.webp
          git add -u ebook-previews/meal-plan.pdf ebook-previews
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Render Meal Plan as optimized page stack"
          git push origin HEAD:main
