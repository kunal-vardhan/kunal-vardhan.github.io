name: Add homepage brand marquee

on:
  push:
    paths:
      - '.github/workflows/add-brand-marquee.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install scroll-reactive brand marquee
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('story.css')
          js_path = Path('story.js')
          index_path = Path('index.html')

          css = css_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          css_marker = '/* homepage brand marquee motion */'
          js_marker = '/* homepage brand marquee motion */'

          if css_marker not in css:
              css += r'''

/* homepage brand marquee motion */
.wordmark-strip.is-marquee{display:block;position:relative;overflow:hidden;margin-top:12px;max-width:100%;mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%)}
.wordmark-strip.is-marquee .wordmark-track{display:flex;align-items:stretch;width:max-content;will-change:transform;transform:translate3d(0,0,0)}
.wordmark-strip.is-marquee .wordmark-group{display:flex;align-items:stretch;flex:0 0 auto;column-gap:30px;padding-right:30px}
.wordmark-strip.is-marquee .wordmark{flex:0 0 auto}
@media(prefers-reduced-motion:reduce){.wordmark-strip.is-marquee{mask-image:none;-webkit-mask-image:none;overflow:visible}.wordmark-strip.is-marquee .wordmark-track{display:flex;flex-wrap:wrap;gap:12px 30px;transform:none!important}.wordmark-strip.is-marquee .wordmark-group{display:contents}.wordmark-strip.is-marquee .wordmark-group[aria-hidden="true"]{display:none}}
'''
              css_path.write_text(css, encoding='utf-8')

          if js_marker not in js:
              js += r'''

/* homepage brand marquee motion */
document.addEventListener('DOMContentLoaded',()=>{
  const strip=document.querySelector('.brand-strip .wordmark-strip');
  if(!strip||strip.dataset.motionReady==='true')return;
  strip.dataset.motionReady='true';
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  const original=[...strip.querySelectorAll(':scope > .wordmark')];
  if(!original.length)return;

  const track=document.createElement('div');
  track.className='wordmark-track';
  const group=document.createElement('div');
  group.className='wordmark-group';
  original.forEach(item=>group.appendChild(item));
  track.appendChild(group);
  for(let i=0;i<2;i++){
    const clone=group.cloneNode(true);
    clone.setAttribute('aria-hidden','true');
    clone.querySelectorAll('*').forEach(el=>el.setAttribute('aria-hidden','true'));
    track.appendChild(clone);
  }
  strip.appendChild(track);
  strip.classList.add('is-marquee');

  if(reduced.matches)return;

  let offset=0;
  let velocity=-18;
  let impulse=0;
  let lastTime=performance.now();
  let lastScroll=window.scrollY;
  let groupWidth=group.getBoundingClientRect().width;
  let hovering=false;
  let visible=true;

  const refreshWidth=()=>{groupWidth=group.getBoundingClientRect().width||groupWidth;};
  const onScroll=()=>{
    const y=window.scrollY;
    const delta=y-lastScroll;
    lastScroll=y;
    impulse=Math.max(-150,Math.min(150,impulse-delta*1.7));
  };
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',refreshWidth,{passive:true});

  if(window.matchMedia('(hover:hover) and (pointer:fine)').matches){
    strip.addEventListener('pointerenter',()=>{hovering=true;});
    strip.addEventListener('pointerleave',()=>{hovering=false;});
  }

  if('IntersectionObserver' in window){
    const observer=new IntersectionObserver(entries=>{visible=entries[0]?.isIntersecting??true;},{threshold:0});
    observer.observe(strip);
  }

  const frame=(now)=>{
    const dt=Math.min(.05,(now-lastTime)/1000);
    lastTime=now;
    if(visible&&groupWidth>0){
      impulse*=Math.exp(-4.2*dt);
      const resting=hovering?-1.5:-18;
      const target=resting+impulse;
      velocity+=(target-velocity)*Math.min(1,6*dt);
      offset+=velocity*dt;
      while(offset<=-groupWidth)offset+=groupWidth;
      while(offset>0)offset-=groupWidth;
      track.style.transform=`translate3d(${offset.toFixed(2)}px,0,0)`;
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
});
'''
              js_path.write_text(js, encoding='utf-8')

          old_css='/story.css?v=3'
          old_js='/story.js?v=2'
          if old_css in index:
              index=index.replace(old_css,'/story.css?v=5',1)
          elif '/story.css?v=5' not in index:
              raise SystemExit('Unexpected homepage story.css version')
          if old_js in index:
              index=index.replace(old_js,'/story.js?v=3',1)
          elif '/story.js?v=3' not in index:
              raise SystemExit('Unexpected homepage story.js version')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate motion implementation
        run: |
          node --check story.js
          python - <<'PY'
          from pathlib import Path
          css=Path('story.css').read_text(encoding='utf-8')
          js=Path('story.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          required_css=['.wordmark-strip.is-marquee','.wordmark-track','.wordmark-group','prefers-reduced-motion']
          required_js=['requestAnimationFrame(frame)','IntersectionObserver','impulse-delta*1.7','hovering?-1.5:-18','aria-hidden']
          for token in required_css:
              if token not in css: raise SystemExit(f'Missing CSS token: {token}')
          for token in required_js:
              if token not in js: raise SystemExit(f'Missing JS token: {token}')
          if '/story.css?v=5' not in index or '/story.js?v=3' not in index:
              raise SystemExit('Homepage cache-bust versions were not updated')
          print('Validated scroll-reactive marquee, hover slowdown, edge fade, and reduced-motion fallback')
          PY

      - name: Commit homepage animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          LATEST="$(git rev-parse origin/main)"
          BASE="$(git rev-parse HEAD)"
          echo "Latest main SHA: $LATEST"
          echo "Checked-out SHA: $BASE"
          if [ "$LATEST" != "$BASE" ]; then
            echo "main changed while preparing animation; refusing to overwrite it"
            exit 1
          fi
          git add story.css story.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add scroll-reactive homepage brand marquee"
          git push origin HEAD:main
