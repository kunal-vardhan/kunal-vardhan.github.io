name: Build HP redesign preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hp-preview-build.yml'
permissions:
  contents: write
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build isolated preview from redesign branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin harry-potter-revamp
          rm -rf hp-preview
          mkdir -p hp-preview/case-studies
          for file in index.html strategy.html about.html work.html; do
            git show origin/harry-potter-revamp:$file > hp-preview/$file
          done
          for file in index.html api-organic-growth.html logistics-search-growth.html enterprise-software-content.html learniverse-growth.html; do
            git show origin/harry-potter-revamp:case-studies/$file > hp-preview/case-studies/$file
          done
          git show origin/harry-potter-revamp:revamp.css > hp-preview/revamp.css
          git show origin/harry-potter-revamp:revamp-fixes.css > hp-preview/revamp-fixes.css
          git show origin/harry-potter-revamp:revamp.js > hp-preview/revamp.js
          git show origin/harry-potter-revamp:world-v2-tune.css > hp-preview/work-bridge.css
          git show origin/harry-potter-revamp:world-v2.js > hp-preview/work-bridge.js
          python - <<'PY'
          from pathlib import Path
          root = Path('hp-preview')
          html_files = list(root.glob('*.html')) + list((root/'case-studies').glob('*.html'))
          replacements = [
              ('href="/case-studies/', 'href="/hp-preview/case-studies/'),
              ('href="/strategy.html', 'href="/hp-preview/strategy.html'),
              ('href="/work.html', 'href="/hp-preview/work.html'),
              ('href="/about.html', 'href="/hp-preview/about.html'),
              ('href="/"', 'href="/hp-preview/"'),
              ('href="/revamp.css?v=1"', 'href="/hp-preview/revamp.css?v=1"'),
              ('src="/revamp.js?v=1"', 'src="/hp-preview/revamp.js?v=1"'),
          ]
          for p in html_files:
              s = p.read_text()
              for a,b in replacements: s=s.replace(a,b)
              if p.name == 'work.html' and p.parent == root:
                  s=s.replace('href="/world-v2-tune.css?v=1"','href="/hp-preview/work-bridge.css?v=1"')
                  s=s.replace('src="/world-v2.js?v=1"','src="/hp-preview/work-bridge.js?v=1"')
              p.write_text(s)

          p = root/'revamp.js'
          s = p.read_text()
          s=s.replace("'/revamp-fixes.css?v=1'", "'/hp-preview/revamp-fixes.css?v=1'")
          s=s.replace('href="/case-studies/', 'href="/hp-preview/case-studies/')
          s=s.replace('href="/strategy.html', 'href="/hp-preview/strategy.html')
          s=s.replace('href="/work.html', 'href="/hp-preview/work.html')
          s=s.replace('href="/about.html', 'href="/hp-preview/about.html')
          s=s.replace('href="/"', 'href="/hp-preview/"')
          p.write_text(s)

          p = root/'work-bridge.css'
          p.write_text(p.read_text().replace("/revamp.css?v=1", "/hp-preview/revamp.css?v=1"))
          p = root/'work-bridge.js'
          p.write_text(p.read_text().replace("/revamp.js?v=1", "/hp-preview/revamp.js?v=1"))
          PY
          printf '%s\n' 'Harry Potter redesign preview. Existing production routes are unchanged.' > hp-preview/README.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hp-preview
          git diff --cached --quiet && exit 0
          git commit -m 'Publish isolated Harry Potter redesign preview'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" || { echo 'main changed during preview build'; exit 1; }
          git push origin HEAD:main
