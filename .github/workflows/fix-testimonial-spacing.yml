name: Fix testimonial spacing
on:
  push:
    paths:
      - '.github/workflows/fix-testimonial-spacing.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply testimonial spacing fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('world-v2-tune.css')
          s = p.read_text()
          marker = '/* Screenshot QA round 3: testimonial spacing. */'
          if marker not in s:
              s += '''\n\n/* Screenshot QA round 3: testimonial spacing. */\nbody.page-home .review-card{\n  padding:24px 26px 22px!important;\n}\nbody.page-home .review-card blockquote{\n  margin:0!important;\n}\nbody.page-home .review-card footer{\n  margin-top:16px!important;\n  padding:0!important;\n  line-height:1.5!important;\n}\nbody.page-home .review-card footer strong{\n  display:block;\n  margin-bottom:2px;\n}\n@media(max-width:760px){\n  body.page-home .review-card{padding:20px 20px 18px!important}\n}\n'''
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-v2-tune.css
          git commit -m 'Fix testimonial card spacing'
          git push
