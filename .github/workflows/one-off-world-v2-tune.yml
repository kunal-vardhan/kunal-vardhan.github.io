name: One-off world v2 tuning rollout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-world-v2-tune.yml'
permissions:
  contents: write
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Load typography and Potter tuning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = [
              'index.html',
              'strategy.html',
              'work.html',
              'about.html',
              'case-studies/index.html',
              'case-studies/api-organic-growth.html',
              'case-studies/logistics-search-growth.html',
              'case-studies/enterprise-software-content.html',
              'case-studies/learniverse-growth.html',
          ]
          css_marker = '<link rel="stylesheet" href="/world-v2.css?v=1">'
          css_new = css_marker + '<link rel="stylesheet" href="/world-v2-tune.css?v=1">'
          js_marker = '<script src="/world-v2.js?v=1" defer></script>'
          js_new = js_marker + '<script src="/world-v2-potter.js?v=1" defer></script>'
          for filename in pages:
              p = Path(filename)
              s = p.read_text()
              if '/world-v2-tune.css?v=1' not in s:
                  if css_marker not in s:
                      raise SystemExit(f'world-v2 CSS marker missing in {filename}')
                  s = s.replace(css_marker, css_new, 1)
              if '/world-v2-potter.js?v=1' not in s:
                  if js_marker not in s:
                      raise SystemExit(f'world-v2 JS marker missing in {filename}')
                  s = s.replace(js_marker, js_new, 1)
              p.write_text(s)
          PY
      - name: Verify brand, work, and proof safeguards
        run: |
          grep -q 'Display/headlines: Playfair Display' BRAND.md
          grep -q 'Body/UI: Inter' BRAND.md
          grep -q 'font-family:Inter' world-v2-tune.css
          grep -q 'Playfair Display' world-v2-tune.css
          grep -q 'work-preview-motion.css' work.html
          grep -q 'page-scroll-frame' work.html
          grep -q 'story.js?v=4' work.html
          grep -q 'ebook-preview-motion.js?v=1' work.html
          grep -q '29 → 3,842' case-studies/api-organic-growth.html
          grep -q '0 → ~2,500' case-studies/learniverse-growth.html
          grep -q 'world-v2-tune.css?v=1' index.html
          grep -q 'world-v2-potter.js?v=1' about.html
      - name: Commit and push
        run: |
          git config user.name "Kunal Vardhan"
          git config user.email "kunalwritescopy@gmail.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add index.html strategy.html work.html about.html case-studies/index.html case-studies/*.html
          git commit -m "Fix redesign typography footer and Potter cues"
          git push origin HEAD:main
