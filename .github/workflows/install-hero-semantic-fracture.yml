name: Install homepage semantic fracture

on:
  push:
    paths:
      - '.github/workflows/install-hero-semantic-fracture.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace one-shot hero motion with scroll fracture
        env:
          NEW_CSS_B64: 
          NEW_JS_B64: 
        run: |
          python - <<'PY'
          import base64, os, re
          from pathlib import Path
          css_path=Path('story.css'); js_path=Path('story.js'); index_path=Path('index.html')
          css=css_path.read_text(encoding='utf-8'); js=js_path.read_text(encoding='utf-8'); index=index_path.read_text(encoding='utf-8')
          if '/* homepage hero resolve motion */' not in css or '/* homepage hero resolve motion */' not in js:
              raise SystemExit('Existing hero resolve markers not found')
          new_css=base64.b64decode(os.environ['NEW_CSS_B64']).decode('utf-8')
          new_js=base64.b64decode(os.environ['NEW_JS_B64']).decode('utf-8')
          css=re.sub(r'/\* homepage hero resolve motion \*/[\s\S]*\Z',new_css,css,count=1)
          js=re.sub(r'/\* homepage hero resolve motion \*/[\s\S]*\Z',new_js,js,count=1)
          if '/story.css?v=7' not in index or '/story.js?v=4' not in index:
              raise SystemExit('Unexpected homepage asset versions')
          index=index.replace('/story.css?v=7','/story.css?v=8',1).replace('/story.js?v=4','/story.js?v=5',1)
          css_path.write_text(css,encoding='utf-8'); js_path.write_text(js,encoding='utf-8'); index_path.write_text(index,encoding='utf-8')
          PY

      - name: Validate semantic fracture
        run: |
          ! grep -q 'homepage hero resolve motion' story.css
          ! grep -q 'homepage hero resolve motion' story.js
          grep -q 'homepage hero semantic fracture' story.css
          grep -q 'homepage hero semantic fracture' story.js
          grep -q 'Math.sin(Math.PI\*progress)' story.js
          grep -q 'x:98,y:-34' story.js
          grep -q 'clip-path:inset' story.css
          grep -q '/story.css?v=8' index.html
          grep -q '/story.js?v=5' index.html
          grep -q '<strong>5 years</strong>' index.html

      - name: Commit semantic fracture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          LATEST="$(git rev-parse origin/main)"
          BASE="$(git rev-parse HEAD)"
          echo "Latest main SHA: $LATEST"
          echo "Checked-out SHA: $BASE"
          if [ "$LATEST" != "$BASE" ]; then
            echo "main changed while preparing semantic fracture; refusing to overwrite it"
            exit 1
          fi
          git add story.css story.js index.html
          git commit -m "Replace hero intro with scroll semantic fracture"
          git push origin HEAD:main
