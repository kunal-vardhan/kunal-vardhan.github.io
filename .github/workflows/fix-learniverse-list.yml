name: Fix Learniverse result list
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-learniverse-list.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix invalid result-list wrapper
        shell: python
        run: |
          from pathlib import Path
          p = Path('case-studies/learniverse-growth.html')
          text = p.read_text(encoding='utf-8')
          old = '<div class="result-list"><li><strong>0</strong><span>meaningful organic content baseline at the start</span></li><li><strong>~2,500</strong><span>monthly organic visits by the time my work ended</span></li></div>'
          new = '<ul class="result-list"><li><strong>0</strong><span>meaningful organic content baseline at the start</span></li><li><strong>~2,500</strong><span>monthly organic visits by the time my work ended</span></li></ul>'
          if old not in text:
              raise SystemExit('Expected Learniverse result list markup not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies/learniverse-growth.html
          git commit -m "Fix Learniverse result list markup"
          git push origin HEAD:main