name: Remove hero shatter

on:
  push:
    paths:
      - '.github/workflows/remove-hero-shatter.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove hero shatter and self-clean
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            echo "main changed; aborting"
            exit 1
          fi
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); s=s.replace("<link rel=\"stylesheet\" href=\"/hero-shatter.css?v=1\">","").replace("<script src=\"/hero-shatter.js?v=2\" defer></script>",""); p.write_text(s)'
          rm -f hero-shatter.js hero-shatter.css .github/workflows/remove-hero-shatter.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove homepage hero shatter animation"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            echo "main changed before push; aborting"
            exit 1
          fi
          git push origin HEAD:main
