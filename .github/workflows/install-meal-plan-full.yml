name: Install full Meal Plan eBook

on:
  push:
    paths:
      - '.github/workflows/install-meal-plan-full.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and validate full Meal Plan
        run: |
          python -m pip install --disable-pip-version-check gdown pypdf
          mkdir -p ebook-previews
          rm -f ebook-previews/meal-plan.pdf
          gdown --fuzzy "https://drive.google.com/file/d/1azIHW7j73t5n0FUV8sIaSpojdj5aV16k/view?usp=sharing" -O ebook-previews/meal-plan.pdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p = Path("ebook-previews/meal-plan.pdf")
          if not p.exists() or p.stat().st_size < 10_000_000:
              raise SystemExit("Downloaded Meal Plan PDF is missing or unexpectedly small")
          pages = len(PdfReader(str(p)).pages)
          if pages != 61:
              raise SystemExit(f"Expected 61 pages, got {pages}")
          print(f"Validated Meal Plan: {pages} pages, {p.stat().st_size} bytes")
          PY

      - name: Replace Meal Plan card and remove old preview files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("work.html")
          html = path.read_text(encoding="utf-8")

          byline = '<aside class="byline-note" aria-label="Ghostwriting and byline disclosure"><span class="byline-label">About the bylines</span><strong>Why some samples don’t have my name</strong><p>A part of my client work has been ghostwritten or published under the brand’s name. So you may open a sample and not see “Kunal Vardhan” in the byline. The pieces shown here are work I contributed to directly through writing, research, structure, or content development.</p></aside>'
          if html.count(byline) != 1:
              raise SystemExit("Expected exact byline disclosure was not found once")

          pattern = re.compile(r'<article class="ebook-sample-card"><div class="visual-work-head"><div><span>FastMate · eBook</span><h3>Your Personal Meal Plan</h3></div></div>.*?</article>', re.S)
          replacement = '<article class="ebook-sample-card"><div class="visual-work-head"><div><span>FastMate · eBook</span><h3>Your Personal Meal Plan</h3></div></div><div class="ebook-scroll-frame"><iframe src="/ebook-previews/meal-plan.pdf#page=1&view=FitH" title="Full 61-page Your Personal Meal Plan eBook" loading="lazy" style="display:block;width:100%;height:100%;border:0;background:#fff"></iframe></div><p>Full 61-page eBook covering the complete 30-day meal plan and supporting menu sections.</p></article>'

          html2, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit(f"Expected one Meal Plan card replacement, got {count}")
          if html2.count(byline) != 1:
              raise SystemExit("Byline disclosure changed during patch")
          path.write_text(html2, encoding="utf-8")
          PY

          rm -f \
            ebook-previews/meal-plan-01.webp \
            ebook-previews/meal-plan-02.webp \
            ebook-previews/meal-plan.webp \
            ebook-previews/meal-plan.b64

      - name: Commit Meal Plan replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          LATEST="$(git rev-parse origin/main)"
          BASE="$(git rev-parse HEAD)"
          echo "Latest main SHA: $LATEST"
          echo "Checked-out SHA: $BASE"
          if [ "$LATEST" != "$BASE" ]; then
            echo "main changed while this workflow was running; refusing to overwrite it"
            exit 1
          fi

          git add work.html ebook-previews/meal-plan.pdf
          git add -u ebook-previews
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace Meal Plan with full eBook"
          git push origin HEAD:main
