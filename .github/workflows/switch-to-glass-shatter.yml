name: Switch homepage hero to glass shatter

on:
  push:
    paths:
      - '.github/workflows/switch-to-glass-shatter.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch hero assets and remove old motion
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path=Path('story.css')
          js_path=Path('story.js')
          index_path=Path('index.html')
          css=css_path.read_text(encoding='utf-8')
          js=js_path.read_text(encoding='utf-8')
          index=index_path.read_text(encoding='utf-8')

          css_marker='/* homepage hero live fracture */'
          js_marker='/* homepage hero live fracture */'
          if css_marker not in css or js_marker not in js:
              raise SystemExit('Old hero fracture block not found')
          css=re.sub(r'/\* homepage hero live fracture \*/[\s\S]*\Z','',css,count=1).rstrip()+'\n'
          js=re.sub(r'/\* homepage hero live fracture \*/[\s\S]*\Z','',js,count=1).rstrip()+'\n'

          if '/story.css?v=9' not in index or '/story.js?v=6' not in index:
              raise SystemExit('Unexpected homepage asset versions')
          index=index.replace('/story.css?v=9','/story.css?v=10',1)
          index=index.replace('/story.js?v=6','/story.js?v=7',1)
          index=index.replace('<link rel="stylesheet" href="/home-work.css?v=1">','<link rel="stylesheet" href="/home-work.css?v=1"><link rel="stylesheet" href="/hero-shatter.css?v=1">',1)
          index=index.replace('<script src="/story.js?v=7" defer></script>','<script src="/hero-shatter.js?v=1" defer></script><script src="/story.js?v=7" defer></script>',1)

          css_path.write_text(css,encoding='utf-8')
          js_path.write_text(js,encoding='utf-8')
          index_path.write_text(index,encoding='utf-8')
          PY

      - name: Validate switch
        run: |
          ! grep -q 'homepage hero live fracture' story.css
          ! grep -q 'homepage hero live fracture' story.js
          grep -q '/hero-shatter.css?v=1' index.html
          grep -q '/hero-shatter.js?v=1' index.html
          grep -q '/story.css?v=10' index.html
          grep -q '/story.js?v=7' index.html
          grep -q '<strong>5 years</strong>' index.html
          grep -q 'homepage hero glass shatter' hero-shatter.css
          grep -q 'homepage hero glass shatter' hero-shatter.js

      - name: Commit glass shatter switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          LATEST="$(git rev-parse origin/main)"
          BASE="$(git rev-parse HEAD)"
          echo "Latest main SHA: $LATEST"
          echo "Checked-out SHA: $BASE"
          if [ "$LATEST" != "$BASE" ]; then
            echo "main changed while preparing hero switch; refusing to overwrite it"
            exit 1
          fi
          git add story.css story.js index.html
          git commit -m "Switch homepage hero to glass shatter effect"
          git push origin HEAD:main
