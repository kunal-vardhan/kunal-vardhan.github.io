name: One-off homepage threshold patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-home-threshold.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Wire homepage magical threshold
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = [
              ('<link rel="stylesheet" href="/home-work.css?v=3">', '<link rel="stylesheet" href="/home-work.css?v=3"><link rel="stylesheet" href="/magic-foundation.css?v=1">'),
              ('<body>', '<body class="magic-home">'),
              ('<h1>I write and plan content for products that are hard to explain.</h1>', '<h1>Complicated product? Good. Those are more fun to explain.</h1>'),
              ('<p class="hero-text">Most of my recent work has been around B2B SaaS, APIs, logistics, cybersecurity, and enterprise software. Sometimes the job is an article. Sometimes it is a roadmap, landing page, comparison, refresh plan, or a connected set of pages.</p>', '<p class="hero-text">I write and plan content for B2B SaaS, APIs, logistics, cybersecurity, and other products that need more than “just make it simple.” Sometimes that means an article. Sometimes a roadmap, comparison page, landing page, refresh plan, or a whole cluster that finally makes sense.</p>'),
              ('<div class="hero-actions"><a class="btn btn-primary" href="/case-studies/">See the case studies</a><a class="btn btn-secondary" href="/work.html">Browse my work</a></div><div class="hero-proof">', '<div class="hero-actions"><a class="btn btn-primary" href="/case-studies/">See the case studies</a><a class="btn btn-secondary" href="/work.html">Browse my work</a></div><p class="hero-whisper">No spell for this bit. Mostly research.</p><div class="hero-proof">'),
              ('<script src="/proof-metrics.js?v=2" defer></script>', '<script src="/magic-foundation.js?v=1" defer></script><script src="/proof-metrics.js?v=2" defer></script>')
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Marker not found: {old[:90]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "Kunal Vardhan"
          git config user.email "kunalwritescopy@gmail.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add index.html
          git commit -m "Redesign homepage threshold with magical foundation"
          git push origin HEAD:main
