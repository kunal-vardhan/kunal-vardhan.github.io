name: One-off About magic patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-about-magic.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Wire About magic section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path('about.html')
          s = p.read_text()

          head_old = '<link rel="stylesheet" href="/story.css?v=4"></head>'
          head_new = '<link rel="stylesheet" href="/story.css?v=4"><link rel="stylesheet" href="/about-magic.css?v=1"></head>'
          if head_old not in s:
              raise SystemExit('About head marker not found')
          s = s.replace(head_old, head_new, 1)

          section_b64 = ''
          section = base64.b64decode(section_b64).decode()
          marker = '<section class="section section-soft" id="brands">'
          if marker not in s:
              raise SystemExit('Brands marker not found')
          s = s.replace(marker, section + marker, 1)

          body_old = '<script src="/story.js?v=2" defer></script></body>'
          body_new = '<script src="/story.js?v=2" defer></script><script src="/about-magic.js?v=1" defer></script></body>'
          if body_old not in s:
              raise SystemExit('About script marker not found')
          s = s.replace(body_old, body_new, 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "Kunal Vardhan"
          git config user.email "kunalwritescopy@gmail.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add about.html
          git commit -m "Add interactive off-duty About section"
          git push origin HEAD:main
