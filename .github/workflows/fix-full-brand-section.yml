name: Fix full brand section

on:
  push:
    paths:
      - '.github/workflows/fix-full-brand-section.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix full Brands section layout
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('story.css')
          css = css_path.read_text(encoding='utf-8')
          old = '.full-brand-wall{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink)}.full-brand-wall .brand-mark{min-height:52px;padding:13px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center}.full-brand-wall .brand-mark:nth-child(4n){border-right:0}.full-brand-wall img{display:none!important}.full-brand-wall strong{font-family:"Playfair Display",serif;font-size:.88rem}'
          new = '#brands .section-head{align-items:start}.full-brand-wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink)}.full-brand-wall .brand-mark{min-height:56px;padding:0 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center}.full-brand-wall .brand-mark:nth-child(3n){border-right:0}.full-brand-wall img{display:none!important}.full-brand-wall strong{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:.82rem;font-weight:600;line-height:1.3}'
          if css.count(old) != 1:
              raise SystemExit(f'Expected one desktop brand-wall rule, found {css.count(old)}')
          css = css.replace(old, new, 1)

          mobile_old = '.full-brand-wall{grid-template-columns:1fr 1fr}.strategy-grid-2'
          mobile_new = '.full-brand-wall{grid-template-columns:1fr 1fr}.full-brand-wall .brand-mark{border-right:1px solid var(--line)}.full-brand-wall .brand-mark:nth-child(2n){border-right:0}.strategy-grid-2'
          if css.count(mobile_old) != 1:
              raise SystemExit(f'Expected one mobile brand-wall rule, found {css.count(mobile_old)}')
          css = css.replace(mobile_old, mobile_new, 1)
          css_path.write_text(css, encoding='utf-8')

          about_path = Path('about.html')
          about = about_path.read_text(encoding='utf-8')
          if about.count('/story.css?v=3') != 1:
              raise SystemExit('Unexpected about.html stylesheet reference')
          about = about.replace('/story.css?v=3', '/story.css?v=4', 1)
          about_path.write_text(about, encoding='utf-8')
          PY

      - name: Validate and commit targeted fix
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('story.css').read_text(encoding='utf-8')
          about = Path('about.html').read_text(encoding='utf-8')
          checks = [
              '#brands .section-head{align-items:start}' in css,
              'grid-template-columns:repeat(3,minmax(0,1fr))' in css,
              '.full-brand-wall .brand-mark:nth-child(3n){border-right:0}' in css,
              '.full-brand-wall .brand-mark:nth-child(2n){border-right:0}' in css,
              'font-family:Inter,system-ui' in css,
              '/story.css?v=4' in about,
          ]
          if not all(checks):
              raise SystemExit('Full Brands section validation failed')
          print('Validated full Brands section alignment and balanced grid')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          LATEST="$(git rev-parse origin/main)"
          BASE="$(git rev-parse HEAD)"
          echo "Latest main SHA: $LATEST"
          echo "Checked-out SHA: $BASE"
          if [ "$LATEST" != "$BASE" ]; then
            echo "main changed while fixing; refusing to overwrite it"
            exit 1
          fi
          git rm .github/workflows/fix-full-brand-section.yml
          git add story.css about.html
          git commit -m "Fix full Brands section alignment"
          git push origin HEAD:main
