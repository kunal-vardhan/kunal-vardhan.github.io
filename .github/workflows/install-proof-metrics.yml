name: Install homepage proof metrics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-proof-metrics.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard latest main
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed after checkout; aborting"
            exit 1
          fi

      - name: Wire proof metric replay into homepage
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<script src="/story.js?v=7" defer></script>'
          new = '<script src="/proof-metrics.js?v=1" defer></script><script src="/story.js?v=7" defer></script>'

          if not Path('proof-metrics.js').exists():
              raise SystemExit('proof-metrics.js is missing')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one story.js marker, found {text.count(old)}')
          if 'proof-metrics.js' in text:
              raise SystemExit('proof-metrics.js is already referenced')

          index.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          grep -Fq '<script src="/proof-metrics.js?v=1" defer></script>' index.html
          grep -Fq '<strong>29 → 3,842</strong>' index.html
          grep -Fq '<strong>0 → ~2,500</strong>' index.html
          grep -Fq '<strong>5 years</strong>' index.html
          rm .github/workflows/install-proof-metrics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Activate living homepage proof metrics'
          git push origin HEAD:main
