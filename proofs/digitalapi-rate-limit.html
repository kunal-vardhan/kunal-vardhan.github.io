<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigitalAPI rate-limit Ahrefs proof</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff}body{min-height:100vh;display:grid;place-items:center}img{display:block;width:100%;height:auto;max-width:620px}.status{margin:24px;font:14px/1.4 Arial,sans-serif;color:#555}</style></head><body><img id="proof" hidden alt="Ahrefs screenshot for DigitalAPI API rate limit exceeded page showing 491 estimated organic traffic, $4.6K traffic value and visible keyword positions"><p id="status" class="status">Loading evidence…</p><script>(async()=>{const i=document.getElementById('proof'),s=document.getElementById('status');try{const p=['/proof-data/rate-0.txt?v=4','/proof-data/rate-1.txt?v=4','/proof-data/rate-2.txt?v=4'];const a=await Promise.all(p.map(async x=>{const r=await fetch(x,{cache:'no-store'});if(!r.ok)throw 0;return(await r.text()).trim()}));const b=atob(a.join('')),u=new Uint8Array(b.length);for(let n=0;n<b.length;n++)u[n]=b.charCodeAt(n);const o=URL.createObjectURL(new Blob([u],{type:'image/webp'}));i.onload=()=>{i.hidden=false;s.remove();URL.revokeObjectURL(o)};i.onerror=()=>s.textContent='Evidence image could not load.';i.src=o}catch(e){s.textContent='Evidence image could not load.'}})();</script></body></html>
